<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e"><title>ShopBill — Smart Billing</title>
<style>
:root{--g:#0f766e;--d:#12302d;--bg:#f4f7f6;--b:#e2e9e7;--mut:#71817e;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial;color:#172b28}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{background:#fff;border-bottom:1px solid var(--b);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}
.brand{font-weight:800;font-size:22px;color:var(--d)}.brand span{background:var(--g);color:white;padding:8px 11px;border-radius:10px;margin-right:8px}
main{max-width:1100px;margin:auto;padding:18px}.nav{display:flex;gap:7px;overflow:auto;padding:12px 0}.nav button,.btn{border:1px solid var(--b);background:#fff;padding:10px 13px;border-radius:9px;color:#334;font-weight:700;white-space:nowrap}.nav button.active,.primary{background:var(--g);color:white;border-color:var(--g)}
h1{font-size:25px;margin:10px 0}.muted{color:var(--mut)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{background:#fff;border:1px solid var(--b);border-radius:13px;padding:16px;margin:12px 0}.metric{font-size:24px;font-weight:800;margin:9px 0}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--mut);font-weight:bold}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--b);border-radius:8px;background:white}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:100px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--b);font-size:13px}th{color:var(--mut)}.scroll{overflow:auto}.notice{padding:10px;background:#e5f5ef;color:#087443;border-radius:8px;margin:10px 0}.danger{color:var(--red)}.tiny{font-size:12px}.pill{background:#e5f5ef;color:#087443;border-radius:20px;padding:4px 8px;font-size:12px}
@media(max-width:600px){main{padding:10px}header{padding:12px}.metric{font-size:21px}}
</style></head><body>
<header><div class="brand"><span>S</span>ShopBill</div><div id="status" class="tiny muted">Connecting…</div></header>
<main>
<section id="auth">
<h1>ShopBill account</h1><p class="muted">Secure server login · Shop billing</p>
<div class="card">
<div class="field"><label>Shop name (register only)</label><input id="shop" placeholder="Anand General Store"></div>
<div class="field"><label>Your name (register only)</label><input id="owner" placeholder="Owner name"></div>
<div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div>
<div class="field"><label>Password</label><input id="password" type="password" minlength="8" placeholder="Minimum 8 characters"></div>
<div class="row"><button class="btn primary" onclick="auth('register')">Register</button><button class="btn" onclick="auth('login')">Login</button></div>
<p class="tiny muted">This starter sends authentication to the backend; passwords are hashed server-side.</p></div></section>
<section id="workspace" class="hidden">
<div class="row"><div><h1 id="welcome">Your shop</h1><p class="muted">Bills · Stock · Ledger · Coins</p></div><button class="btn" onclick="logout()">Log out</button></div>
<div class="nav">
<button class="active" onclick="page('home',this)">Overview</button><button onclick="page('bill',this)">New bill</button><button onclick="page('products',this)">Stock</button><button onclick="page('customers',this)">Ledger</button><button onclick="page('coins',this)">Coins</button><button onclick="page('reports',this)">Reports</button><button onclick="page('profile',this)">Shop profile</button><button onclick="page('plans',this)">₹51 Plan</button>
</div><div id="notice"></div><div id="view"></div></section>
<footer class="tiny muted">ShopBill starter · HTTPS required in production · Payment test mode only</footer>
</main>
<script>
const $=id=>document.getElementById(id);let token=localStorage.getItem("sb_token")||"",me=null,cache={products:[],customers:[],bills:[],payments:[],coins:[]};
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
async function api(path,opts={}){let r=await fetch("/api"+path,{...opts,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(opts.headers||{})}});let j=await r.json().catch(()=>({error:"Invalid server response"}));if(!r.ok)throw Error(j.error||"Request failed");return j}
function msg(s){$("notice").innerHTML='<div class="notice">'+esc(s)+'</div>'}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function auth(mode){try{let body={email:$("email").value,password:$("password").value};if(mode==="register")Object.assign(body,{shopName:$("shop").value,ownerName:$("owner").value});let j=await api("/auth/"+mode,{method:"POST",body:JSON.stringify(body)});token=j.token;localStorage.setItem("sb_token",token);await start()}catch(e){alert(e.message)}}
async function start(){try{me=await api("/me");$("auth").classList.add("hidden");$("workspace").classList.remove("hidden");$("status").textContent="Connected securely";$("welcome").textContent=me.shop.name;await load();page("home")}catch(e){token="";localStorage.removeItem("sb_token");$("status").textContent="Not connected";$("auth").classList.remove("hidden")}}
function logout(){token="";localStorage.removeItem("sb_token");location.reload()}
async function load(){cache=await api("/data")}
function page(p,b){document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));if(b)b.classList.add("active");let v=$("view");
if(p==="home"){let sales=cache.bills.reduce((s,x)=>s+Number(x.total),0),due=cache.bills.reduce((s,x)=>s+Number(x.due),0);v.innerHTML=`<div class="grid"><div class="card">Sales<div class="metric">${money(sales)}</div></div><div class="card">Bills<div class="metric">${cache.bills.length}</div></div><div class="card">Due<div class="metric">${money(due)}</div></div><div class="card">Coins<div class="metric">${cache.coinBalance||0} 🪙</div></div></div><div class="card"><h3>Recent bills</h3>${table(cache.bills.slice(-5).reverse(),["Bill","Customer","Total","Due"])}</div>`}
if(p==="bill"){v.innerHTML=`<div class="card"><h3>Create bill</h3><div class="field"><label>Customer</label><select id="bc">${cache.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div><div class="field"><label>Items (one per line: name,qty,price,gst%)</label><textarea id="items" placeholder="Rice,2,50,0&#10;Soap,1,30,5"></textarea></div><div class="field"><label>Paid ₹</label><input id="paid" type="number" min="0" value="0"></div><div class="field"><label>Attach image (optional)</label><input id="photo" type="file" accept="image/*" capture="environment"></div><button class="btn primary" onclick="createBill()">Save bill</button></div>`}
if(p==="products"){v.innerHTML=`<div class="card"><h3>Add product</h3><div class="row"><input id="pn" placeholder="Product name"><input id="pp" type="number" placeholder="Price"><input id="pg" type="number" placeholder="GST %"><input id="ps" type="number" placeholder="Stock"></div><button class="btn primary" onclick="addProduct()">Add product</button></div><div class="card"><h3>Stock</h3>${table(cache.products,["Product","Price","GST","Stock"])}</div>`}
if(p==="customers"){v.innerHTML=`<div class="card"><h3>Add customer</h3><div class="row"><input id="cn" placeholder="Name"><input id="cp" placeholder="Phone"></div><button class="btn primary" onclick="addCustomer()">Add</button></div><div class="card"><h3>Customer ledger</h3>${table(cache.customers,["Customer","Phone","Balance","Action"],true)}</div>`}
if(p==="coins"){v.innerHTML=`<div class="grid"><div class="card">Coin balance<div class="metric">${cache.coinBalance||0} 🪙</div></div><div class="card">Earn coins by eligible actions; spend coins on reminders.</div></div><div class="card"><h3>Coin history</h3>${table(cache.coins,["Date","Action","Coins","Note"])}</div><div class="card"><h3>Send due reminder</h3><select id="rc">${cache.customers.map(c=>`<option value="${c.id}">${esc(c.name)} · ${money(c.balance)}</option>`).join("")}</select><div class="row"><button class="btn" onclick="remind('whatsapp')">WhatsApp</button><button class="btn" onclick="remind('call')">Call</button><button class="btn" onclick="remind('share')">Share</button></div><p class="tiny muted">Reminder coin cost is controlled by server settings.</p></div>`}
if(p==="reports"){v.innerHTML=`<div class="card"><h3>Reports</h3><div class="row"><input id="from" type="date"><input id="to" type="date"><button class="btn primary" onclick="report()">Apply dates</button></div><div id="reportout"></div><button class="btn" onclick="window.print()">Print / Save PDF</button><button class="btn" onclick="downloadBackup()">Export JSON</button></div>`}
if(p==="profile"){v.innerHTML=`<div class="card"><h3>Business profile</h3><div class="field"><label>Shop name</label><input id="sn" value="${esc(me.shop.name)}"></div><div class="field"><label>Owner</label><input id="so" value="${esc(me.shop.owner||"")}"></div><div class="field"><label>Phone</label><input id="sp" value="${esc(me.shop.phone||"")}"></div><div class="field"><label>Address</label><textarea id="sa">${esc(me.shop.address||"")}</textarea></div><div class="field"><label>GSTIN</label><input id="sg" value="${esc(me.shop.gstin||"")}"></div><button class="btn primary" onclick="saveProfile()">Save</button></div>`}
if(p==="plans"){v.innerHTML=`<div class="card"><span class="pill">SHOPBILL PRO</span><h2>₹51 purchase</h2><p>Unlock paid features with the ₹51 plan.</p><span class="pill">PAYMENT SETUP PENDING</span><p class="muted">Payment is not enabled yet. No money will be charged.</p><button class="btn" disabled>Payment coming soon</button><p class="tiny muted">Later, add your payment provider and merchant details here to enable checkout.</p></div>`}
}
function table(rows,heads,ledger=false){if(!rows?.length)return'<p class="muted">No records yet.</p>';return'<div class="scroll"><table><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+rows.map(x=>'<tr>'+ (ledger?`<td>${esc(x.name)}</td><td>${esc(x.phone||"")}</td><td>${money(x.balance)}</td><td><button class="btn" onclick="payment(${x.id})">Receive</button></td>`:Object.values(x).slice(0,heads.length).map(y=>'<td>'+esc(y)+'</td>').join(''))+'</tr>').join('')+'</table></div>'}
async function createBill(){try{let items=$("items").value.trim().split("\n").map(line=>{let [name,qty,price,gst=0]=line.split(",");return{name:name.trim(),qty:+qty,price:+price,gst:+gst}}).filter(x=>x.name&&x.qty>0);let customerId=+$("bc").value;let j=await api("/bills",{method:"POST",body:JSON.stringify({customerId,items,paid:+$("paid").value||0})});await load();msg("Bill saved: "+j.number);page("home")}catch(e){alert(e.message)}}
async function addProduct(){try{await api("/products",{method:"POST",body:JSON.stringify({name:$("pn").value,price:+$("pp").value,gst:+$("pg").value||0,stock:+$("ps").value||0})});await load();page("products")}catch(e){alert(e.message)}}
async function addCustomer(){try{await api("/customers",{method:"POST",body:JSON.stringify({name:$("cn").value,phone:$("cp").value})});await load();page("customers")}catch(e){alert(e.message)}}
async function payment(id){let amount=+prompt("Amount received ₹");if(!amount)return;try{await api("/payments",{method:"POST",body:JSON.stringify({customerId:id,amount})});await load();page("customers")}catch(e){alert(e.message)}}
async function remind(channel){let id=+$("rc").value;try{let j=await api("/reminders",{method:"POST",body:JSON.stringify({customerId:id,channel})});if(channel==="whatsapp"&&j.url)window.open(j.url,"_blank");else if(channel==="call"&&j.url)location.href=j.url;else if(channel==="share"&&navigator.share)await navigator.share({text:j.message});else alert(j.message);await load();msg("Reminder logged; coins updated by server.")}catch(e){alert(e.message)}}
async function saveProfile(){try{me=await api("/profile",{method:"PUT",body:JSON.stringify({name:$("sn").value,owner:$("so").value,phone:$("sp").value,address:$("sa").value,gstin:$("sg").value})});await load();msg("Profile saved")}catch(e){alert(e.message)}}
async function pay(){try{let j=await api("/payments/checkout",{method:"POST",body:JSON.stringify({plan:"shopbill-51"})});if(j.checkoutUrl)location.href=j.checkoutUrl;else alert("Test checkout created. Configure Razorpay keys in server .env.")}catch(e){alert(e.message)}}
function report(){let f=$("from").value,t=$("to").value;let rows=cache.bills.filter(b=>(!f||b.date>=f)&&(!t||b.date<=t));$("reportout").innerHTML=`<p>Bill count: ${rows.length} · Sales: ${money(rows.reduce((s,b)=>s+b.total,0))} · Due: ${money(rows.reduce((s,b)=>s+b.due,0))}</p>`}
function downloadBackup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(cache,null,2)],{type:"application/json"}));a.download="shopbill-backup.json";a.click()}
if(token)start();
</script></body></html>
